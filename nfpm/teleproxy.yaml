name: teleproxy
arch: ${ARCH}
platform: linux
version: ${VERSION}
release: "1"
section: net
priority: optional
maintainer: "Teleproxy <noreply@teleproxy.github.io>"
description: |
  High-performance MTProto proxy for Telegram with DPI resistance and
  fake-TLS camouflage. Supports direct-to-DC mode, multiple secrets,
  Prometheus metrics, and statically linked with no runtime dependencies.
vendor: "Teleproxy"
homepage: https://github.com/teleproxy/teleproxy
license: GPL-2.0-or-later
contents:
  - src: ./bin/teleproxy-${ARCH}
    dst: /usr/bin/teleproxy
    file_info:
      mode: 0755
  - src: ./files/teleproxy.service
    dst: /usr/lib/systemd/system/teleproxy.service
    file_info:
      mode: 0644
  - src: ./files/config.toml.example
    dst: /etc/teleproxy/config.toml.example
    file_info:
      mode: 0644
  - dst: /etc/teleproxy
    type: dir
    file_info:
      mode: 0750
      owner: root
      group: teleproxy
scripts:
  preinstall: ./files/preinstall.sh
  postinstall: ./files/postinstall.sh
  preremove: ./files/preremove.sh
  postremove: ./files/postremove.sh
rpm:
  group: System Environment/Daemons
  signature:
    key_file: ${SIGNING_KEY_FILE}
